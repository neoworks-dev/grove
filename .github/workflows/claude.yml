name: Claude

# Mentioning @claude on an issue, a comment or a review starts a Claude Code
# runner on it. It reads the repository's CLAUDE.md like any other session, so
# the branch, label and PR conventions come from there rather than from here.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # postinstall downloads nvim and builds native Electron deps, which a
          # runner does not need and which takes minutes; the checks below run
          # off the source tree alone.
          claude_args: |
            --model claude-opus-5
            --allowedTools "Bash(bun install --ignore-scripts),Bash(bun test),Bash(bun run typecheck),Bash(bun run lint),Bash(bun run format)"
          # Grove is an Electron app: it cannot be launched here, so nothing a
          # runner writes is verified against the running app the way CLAUDE.md
          # asks for. Say so rather than let it claim otherwise.
          prompt: |
            You are running in GitHub Actions, headless. You cannot launch Grove
            and the debug harness is not reachable, so you cannot reproduce a UI
            bug or confirm a fix in the app. Read the code, write the change,
            run `bun test` and `bun run typecheck`, and say plainly in the pull
            request that the change is unverified against the running app.
