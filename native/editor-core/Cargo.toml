[package]
name = "editor-core"
version = "0.1.0"
edition = "2024"
description = "The editor without a window: buffer, selections, motions, and the commands that change them."

[lib]
name = "editor_core"

[dependencies]
ropey = "1.6"
regex = "1"
serde = { version = "1", features = ["derive"] }
tree-sitter = { version = "0.25", features = ["wasm"] }
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cmake = "0.7.5"
tree-sitter-containerfile = "0.9.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-fish = "3.6.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-language = "0.1"
tree-sitter-lua = "0.5.0"
tree-sitter-make = "1.1.1"
tree-sitter-md = "0.5.3"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24"
tree-sitter-scss = "1.0.0"
tree-sitter-sequel = "0.3.11"
tree-sitter-surrealql = "0.2.0"
tree-sitter-svelte-ng = "1.0.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-xml = "0.7.0"
tree-sitter-yaml = "0.7.2"

[build-dependencies]
cc = "1"

[dev-dependencies]
serde_json = "1"
