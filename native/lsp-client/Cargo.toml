[package]
name = "lsp-client"
version = "0.1.0"
edition = "2024"
description = "A language server client for the native editor: JSON-RPC over stdio, document sync, and the pure parts of completion, diagnostics and hover."

[lib]
name = "lsp_client"

[[bin]]
name = "fake_lsp"
path = "src/bin/fake_lsp.rs"

[dependencies]
editor-core = { path = "../editor-core" }
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
