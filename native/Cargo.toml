[package]
name = "grove_native"
version = "0.1.0"
edition = "2024"
description = "Grove on svelte-gpui: the native app and the editor it draws with GPUI."

[workspace]
members = ["editor-core", "lsp-client"]

[dependencies]
editor-core = { path = "editor-core" }
lsp-client = { path = "lsp-client" }
# Pinned to the same commit as the runtime in package.json, so the protocol matches.
svelte_gpui_host = { git = "https://github.com/neoworks-dev/svelte-gpui", rev = "090ff172eddd8d9c8b143625c32672bb02a077b1" }
serde_json = "1"
alacritty_terminal = "0.26"
parking_lot = "0.12"
futures = "0.3"
# Installing an extension: its npm tarball is checked against the registry's hash and unpacked.
flate2 = "1"
tar = { version = "0.4", default-features = false }
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
# The tool installer downloads release assets and unpacks zip archives.
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }

[patch.crates-io]
xattr = { git = "https://github.com/neoworks-dev/svelte-gpui", rev = "090ff172eddd8d9c8b143625c32672bb02a077b1" }
# GPUI with svelte-gpui's text cache fix, which keeps a pane resize from shaping all text again.
gpui = { git = "https://github.com/neoworks-dev/svelte-gpui", rev = "090ff172eddd8d9c8b143625c32672bb02a077b1" }
