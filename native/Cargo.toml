[package]
name = "grove_native"
version = "0.1.0"
edition = "2024"
description = "Grove on svelte-gpui: the native app, with the editor from svelte-gpui's editor package."

[dependencies]
# Pinned to the same commit as the runtime in package.json, so the protocol matches. The editor's
# crates come from the same commit, so they build against the same host.
svelte_gpui_host = { git = "https://github.com/neoworks-dev/svelte-gpui", rev = "9a40532f0d62d67d5376f29c8810a2ccd23b1511" }
svelte-gpui-editor = { git = "https://github.com/neoworks-dev/svelte-gpui", rev = "9a40532f0d62d67d5376f29c8810a2ccd23b1511" }
editor-core = { git = "https://github.com/neoworks-dev/svelte-gpui", rev = "9a40532f0d62d67d5376f29c8810a2ccd23b1511" }
lsp-client = { git = "https://github.com/neoworks-dev/svelte-gpui", rev = "9a40532f0d62d67d5376f29c8810a2ccd23b1511" }
serde_json = "1"
alacritty_terminal = "0.26"
parking_lot = "0.12"
futures = "0.3"
# Installing an extension: its npm tarball is checked against the registry's hash and unpacked.
flate2 = "1"
tar = { version = "0.4", default-features = false }
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
# The tool installer downloads release assets and unpacks zip archives.
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }

[patch.crates-io]
xattr = { git = "https://github.com/neoworks-dev/svelte-gpui", rev = "9a40532f0d62d67d5376f29c8810a2ccd23b1511" }
# GPUI with svelte-gpui's text cache fix, which keeps a pane resize from shaping all text again.
gpui = { git = "https://github.com/neoworks-dev/svelte-gpui", rev = "9a40532f0d62d67d5376f29c8810a2ccd23b1511" }
