<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Grove</title>
    <!-- Runtime libraries inject their own <style> tags (style-src
         'unsafe-inline'). Tree-sitter instantiates WASM (script-src
         'wasm-unsafe-eval'). Grammar downloads happen in the main process, so
         connect-src reaches nothing remote. The two custom schemes are both
         served by the main process over its own handlers: grove-plugin: is a
         plugin's bundled code, grove-agent: is a chat attachment, grove-file:
         is a worktree file opened in a file viewer (images, video and audio,
         PDFs and 3D models, which load theirs by fetch). img-src takes blob:
         for the textures a glTF packs into its own buffers. frame-src admits a
         plugin's file viewer page, which main serves under a policy of its own
         that cuts it off from the network.

         img-src is the one directive that reaches the network. Issue bodies,
         comments and avatars are full of GitHub-hosted images, and a client
         that renders none of them shows a different thread than the website
         does. It is narrowed to the hosts GitHub actually serves from —
         avatars and user attachments on githubusercontent.com (camo, which
         proxies images from anywhere else, is one of those subdomains),
         attachments under github.com itself. Nothing else remote loads, and no
         other directive is widened: this buys pictures, not script or fetch. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' grove-plugin:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: grove-agent: grove-file: https://github.com https://*.githubusercontent.com; font-src 'self' data:; media-src 'self' grove-file:; connect-src 'self' grove-plugin: grove-agent: grove-file:; frame-src grove-plugin:; worker-src 'self'"
    />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
