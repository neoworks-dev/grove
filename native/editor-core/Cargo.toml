[package]
name = "editor-core"
version = "0.1.0"
edition = "2024"
description = "The editor without a window: buffer, selections, motions, and the commands that change them."

[lib]
name = "editor_core"

[dependencies]
ropey = "1.6"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
