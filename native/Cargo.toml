[package]
name = "grove_native"
version = "0.1.0"
edition = "2024"
description = "Grove on svelte-gpui: the native app and the editor it draws with GPUI."

[workspace]
members = ["editor-core", "lsp-client"]

[dependencies]
editor-core = { path = "editor-core" }
lsp-client = { path = "lsp-client" }
# Pinned to the same commit as the runtime in package.json, so the protocol matches.
svelte_gpui_host = { git = "https://github.com/neoworks-dev/svelte-gpui", rev = "f0488f588912e2e47b245ab0445b8ff5e5c83ea5" }
serde_json = "1"
alacritty_terminal = "0.26"
parking_lot = "0.12"
futures = "0.3"

[patch.crates-io]
xattr = { git = "https://github.com/neoworks-dev/svelte-gpui", rev = "f0488f588912e2e47b245ab0445b8ff5e5c83ea5" }
